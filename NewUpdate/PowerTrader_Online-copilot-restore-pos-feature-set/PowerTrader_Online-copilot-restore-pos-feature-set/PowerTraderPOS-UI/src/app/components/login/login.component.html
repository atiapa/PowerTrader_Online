<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Adinkra PowerTrader</mat-card-title>
      <mat-card-subtitle>PIN Login</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>PIN</mat-label>
        <input matInput [(ngModel)]="pin" placeholder="Enter 4-digit PIN" type="password" maxlength="4" readonly>
      </mat-form-field>

      <div class="pin-pad">
        <mat-grid-list cols="3" rowHeight="80px" gutterSize="10px">
          @for (num of [1,2,3,4,5,6,7,8,9]; track num) {
            <mat-grid-tile>
              <button mat-raised-button color="primary" class="pin-button" (click)="onPinInput(num.toString())">
                {{num}}
              </button>
            </mat-grid-tile>
          }
          <mat-grid-tile>
            <button mat-raised-button color="warn" class="pin-button" (click)="clearPin()">
              Clear
            </button>
          </mat-grid-tile>
          <mat-grid-tile>
            <button mat-raised-button color="primary" class="pin-button" (click)="onPinInput('0')">
              0
            </button>
          </mat-grid-tile>
          <mat-grid-tile>
            <button mat-raised-button color="primary" class="pin-button" (click)="login()" [disabled]="loading || pin.length !== 4">
              {{loading ? '...' : '✓'}}
            </button>
          </mat-grid-tile>
        </mat-grid-list>
      </div>
    </mat-card-content>
  </mat-card>
</div>
