<mat-toolbar color="primary">
  <span>Fleet Dashboard - {{currentUser?.fullName}}</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="logout()">Logout</button>
</mat-toolbar>
<div class="dashboard-container">
  <h1>Fleet Dashboard</h1>
  <div class="dashboard-grid">
    <mat-card>
      <mat-card-header><mat-card-title>Vehicle Management</mat-card-title></mat-card-header>
      <mat-card-content><p>Manage fleet vehicles</p></mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>Maintenance</mat-card-title></mat-card-header>
      <mat-card-content><p>Schedule vehicle maintenance</p></mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>Fuel Tracking</mat-card-title></mat-card-header>
      <mat-card-content><p>Monitor fuel consumption</p></mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>GPS Tracking</mat-card-title></mat-card-header>
      <mat-card-content><p>Track vehicle locations</p></mat-card-content>
    </mat-card>
  </div>

  <!-- Floating Action Button -->
  <button mat-fab class="fab-add" color="primary" [matMenuTriggerFor]="fleetMenu" matTooltip="Quick Actions">
    <mat-icon>add</mat-icon>
  </button>

  <mat-menu #fleetMenu="matMenu">
    <button mat-menu-item (click)="addVehicle()">
      <mat-icon>directions_car</mat-icon>
      <span>Add Vehicle</span>
    </button>
    <button mat-menu-item (click)="scheduleService()">
      <mat-icon>build</mat-icon>
      <span>Schedule Service</span>
    </button>
    <button mat-menu-item (click)="logFuelEntry()">
      <mat-icon>local_gas_station</mat-icon>
      <span>Log Fuel</span>
    </button>
  </mat-menu>
</div>
