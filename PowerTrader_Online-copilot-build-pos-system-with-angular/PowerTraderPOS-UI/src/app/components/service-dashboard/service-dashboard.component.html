<mat-toolbar color="primary">
  <span>Service Dashboard - {{currentUser?.fullName}}</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="logout()">Logout</button>
</mat-toolbar>
<div class="dashboard-container">
  <h1>Service Dashboard</h1>
  <div class="dashboard-grid">
    <mat-card>
      <mat-card-header><mat-card-title>Service Requests</mat-card-title></mat-card-header>
      <mat-card-content><p>Manage service requests</p></mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>Appointments</mat-card-title></mat-card-header>
      <mat-card-content><p>Schedule service appointments</p></mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>Work Orders</mat-card-title></mat-card-header>
      <mat-card-content><p>Manage work orders</p></mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>Service History</mat-card-title></mat-card-header>
      <mat-card-content><p>View service history</p></mat-card-content>
    </mat-card>
  </div>

  <!-- Floating Action Button -->
  <button mat-fab class="fab-add" color="primary" [matMenuTriggerFor]="serviceMenu" matTooltip="Quick Actions">
    <mat-icon>add</mat-icon>
  </button>

  <mat-menu #serviceMenu="matMenu">
    <button mat-menu-item (click)="createServiceRequest()">
      <mat-icon>build_circle</mat-icon>
      <span>New Service Request</span>
    </button>
    <button mat-menu-item (click)="scheduleAppointment()">
      <mat-icon>event</mat-icon>
      <span>Schedule Appointment</span>
    </button>
    <button mat-menu-item (click)="assignTechnician()">
      <mat-icon>engineering</mat-icon>
      <span>Assign Technician</span>
    </button>
  </mat-menu>
</div>
